<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Kos Finder — platform pencarian kos-kosan di seluruh Indonesia dengan data langsung dari Google Maps dan OpenStreetMap. Cari kos terdekat, bandingkan rating, dan temukan rumah yang terasa seperti rumah." />
  <meta name="theme-color" content="#0f172a" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://kosin.app" />
  <meta property="og:title" content="Kos Finder — Temukan kos yang terasa seperti rumah" />
  <meta property="og:description" content="Cari kos-kosan di seluruh Indonesia. Data langsung dari Google Maps, lengkap dengan rating, foto, dan lokasi." />
  <meta property="og:image" content="https://picsum.photos/seed/kos-og/1200/630" />
  <meta property="og:locale" content="id_ID" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563EB'/%3E%3Cpath d='M9 15.5 16 9.5l7 6V24a1.5 1.5 0 0 1-1.5 1.5h-3.5V19h-4v6.5H10.5A1.5 1.5 0 0 1 9 24z' fill='%23fff'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&display=swap" rel="stylesheet" />
  <title>Kos Finder — Temukan kos yang terasa seperti rumah</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('kos-theme')
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.setAttribute('data-theme', t)
        document.querySelector('meta[name="theme-color"]').setAttribute('content', t === 'dark' ? '#0b1220' : '#0f172a')
      } catch (e) {}
    })()
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
