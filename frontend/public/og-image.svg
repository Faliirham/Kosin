<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dbeafe"/>
      <stop offset="1" stop-color="#eff6ff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="120" cy="120" r="240" fill="#2563eb" opacity="0.35"/>
  <circle cx="1080" cy="560" r="200" fill="#60a5fa" opacity="0.25"/>
  <g transform="translate(720 150)">
    <rect width="380" height="330" rx="20" fill="url(#card)"/>
    <rect x="40" y="40" width="300" height="120" rx="12" fill="#bfdbfe"/>
    <rect x="40" y="180" width="300" height="28" rx="8" fill="#1e3a8a"/>
    <rect x="40" y="222" width="220" height="20" rx="8" fill="#3b82f6"/>
