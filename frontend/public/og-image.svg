  </g>
  <text x="80" y="300" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="84" font-weight="800" fill="#ffffff">Kos Finder</text>
  <text x="82" y="370" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="500" fill="#bfdbfe">Temukan kos yang terasa seperti rumah</text>
  <g transform="translate(82 430)">
